<style>

<header><h1 class="serif">成語群島大冒險</h1><span class="pill">✦ <b id="tot">0</b></span></header>

<section id="v-map">

<div class="grid" id="isl"></div>
<div class="row"><button class="btn" id="certBtn" hidden>領取通關證書</button><button class="btn ghost" id="reset">重新開始</button></div>
</section>

<div class="opts" id="op"></div>
<div id="msg" aria-live="polite"></div>
<div class="row"><button class="btn ghost" id="hint">💡 查看提示（1／3）</button><button class="btn" id="next" hidden>下一題</button></div>
</section>

<section id="v-done" hidden>
<div class="cert"><h2 class="serif" id="dt"></h2><p id="dp"></p><div class="row" style="justify-content:center"><button class="btn" id="dback">回到地圖</button></div></div>
</section>

<section id="v-cert" hidden>
<div class="cert">
<p>成語群島大冒險</p><h2 class="serif" style="font-size:2rem">成語小達人證書</h2>
<p>恭喜冒險者</p><p><input id="nm" placeholder="輸入你的名字" aria-label="冒險者姓名"></p>
<p>完成 7 座島、37 個詞語挑戰，獲得 <b id="cs">0</b> 顆星星。</p><p id="cd"></p>
</div>
<div class="row"><button class="btn" onclick="print()">列印／另存為 PDF</button><button class="btn ghost" id="cback">回到地圖</button></div>
</section>
</main>
